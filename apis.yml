- aid: imperial-college-london:spiral-oai-pmh
  name: Spiral OAI-PMH Metadata Harvesting Endpoint
  x-operator: tenant
  x-operator-evidence: >-
    Served by the same 4Science-hosted DSpace-CRIS instance. Institution-identified, however:
    the Identify response returns repositoryIdentifier spiral.imperial.ac.uk and adminEmail
    spiral-prd@imperial.ac.uk, and every set is namespaced under Imperial's Handle prefix 10044.
  description: >-
    A fully functional OAI-PMH 2.0 harvesting interface — the standards-based way Imperial's
    research outputs reach OpenAIRE, CORE, BASE and the rest of the aggregator layer. Identify,
    ListMetadataFormats and ListSets all answer 200. Eleven metadata prefixes are served —
    oai_dc, qdc, mods, mets, marc, dim, rdf, ore, didl, etdms and uketd_dc — of which etdms and
    uketd_dc are the ETD and UK thesis profiles, evidence of a configured repository rather than
    a default install. A second base URL at /server/oai/openairecris declares OpenAIRE CERIF
    profile 1.1 compatibility. earliestDatestamp is 1916-01-01. No OpenAPI is saved for this
    surface: the protocol is OAI's, the implementation is DSpace's and the hosting is 4Science's,
    so authoring a contract here would credit Imperial with engineering it did not do.
  humanURL: https://spiral.imperial.ac.uk/
  baseURL: https://spiral.imperial.ac.uk/server/oai/request
  tags:
  - OAI-PMH
  - Metadata Harvesting
  - Open Access
  - Research Data
  properties:
  - type: APIReference
    url: https://spiral.imperial.ac.uk/server/oai/request?verb=Identify
  - type: Documentation
    url: https://www.openarchives.org/OAI/openarchivesprotocol.html
