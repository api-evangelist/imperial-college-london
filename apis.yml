- aid: imperial-college-london:canvas-lti-platform
  name: Imperial Canvas LTI 1.3 / OIDC Platform Endpoints
  x-operator: tenant
  x-operator-evidence: >-
    canvas.imperial.ac.uk is a CNAME to imperialcollegelondon-vanity.instructure.com. The
    platform is Instructure Canvas. The keys, the tenancy and the launches are Imperial's; the
    LTI implementation is Instructure's.
  description: >-
    Imperial's Canvas tenancy publishes the two documents an LTI 1.3 tool integrator actually
    needs, unauthenticated, on Imperial's own hostname: an LTI platform JWKS at
    /api/lti/security/jwks (200, 1,408 bytes of RSA public keys used to verify launch
    id_tokens), and an OIDC discovery document at /.well-known/openid-configuration (200,
    issuer https://canvas.imperial.ac.uk, RS256, authorization_code). The Canvas REST API itself
    is present but gated — /api/v1/accounts/self answers 401 "user authorisation required". No
    SCIM surface is exposed. This is the closest thing Imperial has to a documented,
    standards-conformant integration point, and it is Instructure's work.
  humanURL: https://canvas.imperial.ac.uk/
  baseURL: https://canvas.imperial.ac.uk
  tags:
  - Learning Management
  - LTI
  - OIDC
  - Education Technology
  properties:
  - type: x-jwks
    url: https://canvas.imperial.ac.uk/api/lti/security/jwks
  - type: x-openid-configuration
    url: https://canvas.imperial.ac.uk/.well-known/openid-configuration
  - type: Conformance
    url: conformance/imperial-college-london-education-standards.yml
- aid: imperial-college-london:blackboard-learn-rest
  name: Imperial Blackboard Learn REST API
  x-operator: tenant
  x-operator-evidence: >-
    bb.imperial.ac.uk is a CNAME to imperialcollege.blackboard.com. The platform is Blackboard
    Learn, operated by Anthology.
  description: >-
    Imperial runs a second LMS alongside Canvas. Its Blackboard Learn REST API is reachable at
    https://bb.imperial.ac.uk/learn/api/public/v1/; the version endpoint answers 200 without
    authentication and reports Learn 4000.21.0 (rel.22+baf1ac0). Everything of substance —
    /courses, /lti/domains — answers 401 "API request is not authenticated." Recorded because it
    is a live, versioned, institution-hostnamed API surface, not because Imperial authored any
    part of it.
  humanURL: https://bb.imperial.ac.uk/
  baseURL: https://bb.imperial.ac.uk/learn/api/public/v1
