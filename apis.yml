aid: imperial-college-london
name: Imperial College London
x-type: university
x-category: Public Research University
description: >-
  Imperial College London is a UK public research university and Russell Group member
  specialising in science, engineering, medicine and business. Re-profiled 2026-08-19 under the
  API Evangelist university pipeline, which settles WHO OPERATES each surface before crediting
  it. The finding is that Imperial operates no public developer portal, no open data portal
  (data.imperial.ac.uk does not resolve) and no self-service API programme — and that almost
  every machine-readable surface running under an imperial.ac.uk hostname is a vendor tenancy:
  Spiral, the open-access repository, is DSpace-CRIS hosted by 4Science; library-search is Ex
  Libris Primo; profiles is Symplectic Elements; canvas and bb are Instructure Canvas and
  Blackboard Learn; servicemgt is ServiceNow. Imperial's data, DOIs, Handle prefix (10044) and
  administrative contacts sit behind all of them, but the contracts do not belong to Imperial.
  Exactly two machine-readable surfaces are Imperial-operated: the Shibboleth SAML 2.0 identity
  provider at shibboleth.imperial.ac.uk, registered in the UK Access Management Federation, and
  an llms.txt agent-guidance file the institution authored and maintains. A third, an Azure-hosted
  JSON gateway at api.imperial.ac.uk, answers with structured JSON but publishes no documented
  or discoverable operation. The programmable footprint is genuinely thin, and it is thin in the
  way universities are thin — a federation of buyers, not a producer.
