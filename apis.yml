x-coverage:
  state: gated
  reason: >-
    Imperial publishes no developer portal, no API catalogue and no OpenAPI of its own. Every
    callable surface found under imperial.ac.uk is either vendor software running under an
    Imperial hostname, or an institution-operated endpoint whose useful operations require
    federated authentication. Nothing was blocked to us — 27 hosts and paths were probed
    successfully and the thinness is the institution's, not a fetch failure.
  detail: >-
    Verified institution-operated and machine-readable: the Shibboleth IdP metadata document
    (200, 12,549 bytes of SAML 2.0 EntityDescriptor, entityID
    https://shibboleth.imperial.ac.uk/shibboleth, present in the UK Access Management Federation
    aggregate alongside 11,112 other entities) and www.imperial.ac.uk/llms.txt (200, 5,803 bytes,
    self-dated 2026-06-23, with per-section crawl priorities and attribution rules).
    Verified live but tenant-operated: the Spiral DSpace 7.6.1 REST API and its OAI-PMH endpoint
    (11 metadata prefixes, OpenAIRE CERIF 1.1), the Canvas LTI 1.3 JWKS and OIDC discovery
    documents, and the Blackboard Learn public REST version endpoint. Institution-operated but
    gated: api.imperial.ac.uk resolves to 20.77.142.125 (Azure) and answers every path — /, /v1,
    /docs, /openapi.json, /swagger.json, /health, /.well-known/openapi.json — with
    `{"statusCode":404,"message":"Resource not found"}` as application/json. That is a live API
    gateway with no published surface, not a dead host. Confirmed dead or absent, and removed
    from or never added to this profile: data.imperial.ac.uk, developer.imperial.ac.uk and
    openaccess.imperial.ac.uk (no DNS); www.imperial.ac.uk/business-school/icbs-apis/ (403 that
    renders a "Page not found" body — soft-404, and robots.txt disallows it);
    profiles.imperial.ac.uk (200 but the identical 4,151-byte SPA shell at /, /api and
    /server/api — soft-200, no API); /.well-known/security.txt and /news/rss/ (404 HTML).
