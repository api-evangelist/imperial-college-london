apis:
- aid: imperial-college-london:shibboleth-idp
  name: Imperial Shibboleth Identity Provider (SAML 2.0)
  x-operator: institution
  x-operator-evidence: >-
    shibboleth.imperial.ac.uk resolves to shibboleth.gslb21.ic.ac.uk -> 146.179.42.66, Imperial's
    own load-balanced infrastructure — not a vendor CNAME. The metadata document is served from
    that host and scopes itself to imperial.ac.uk.
  description: >-
    Imperial's own Shibboleth IdP, and the one unambiguously institution-operated machine-readable
    contract it publishes. The metadata document at /idp/shibboleth is a live 12.5KB SAML 2.0
    EntityDescriptor with entityID https://shibboleth.imperial.ac.uk/shibboleth, one
    IDPSSODescriptor and one AttributeAuthorityDescriptor, SSO and SLO endpoints for the SAML2
    Redirect, POST and POST-SimpleSign bindings plus legacy Shibboleth SSO, SOAP
    ArtifactResolution and AttributeQuery on :8443, and a `shibmd:Scope` of imperial.ac.uk. The
    entityID is registered in the UK Access Management Federation aggregate. This is not a REST
    API and is not self-service — consuming it means being a federation member — but it is a
    published, versioned, machine-readable interface contract that Imperial itself operates.
  humanURL: https://www.imperial.ac.uk/admin-services/ict/
  tags:
  - Identity
  - Identity Federation
  - SSO
  - SAML
  - Shibboleth
  properties:
  - type: x-saml-metadata
    url: https://shibboleth.imperial.ac.uk/idp/shibboleth
  - type: Documentation
    url: https://www.ukfederation.org.uk/
  - type: Website
    url: https://www.imperial.ac.uk/admin-services/ict/
- aid: imperial-college-london:spiral-dspace-rest
  name: Spiral Open Access Repository (DSpace 7 REST API)
  x-operator: tenant
  x-operator-evidence: >-
    spiral.imperial.ac.uk is a CNAME to icl-repository.prod.4science.cloud. The software is
    DSpace 7.6.1 with DSpace-CRIS 2023.02.05, operated by 4Science. Imperial owns the records,
    the Handle prefix 10044, the DOIs (DataCite provider URKS) and the admin contact
    spiral-prd@imperial.ac.uk. Same shape as scholarbank.nus.edu.sg CNAMEing to
    openrepository.com. The three OpenAPIs below were derived from THIS instance — servers[] and
    info.contact both name Spiral — so they are instance-specific rather than a shared vendor
    document, but the engineering they describe is 4Science's, not Imperial's.
  description: >-
    Imperial's institutional open-access repository, exposed over the DSpace 7 HAL+JSON REST API
    at https://spiral.imperial.ac.uk/server/api. The read-oriented subset is genuinely public:
    /core/communities, /core/collections and /discover/search/objects all answer 200
    unauthenticated. /core/items as a collection answers 401 — item access is by UUID. Collapsed
    from three separate apis[] entries (core / discover / root) into one on 2026-08-19: those
    were an artifact of refine-openapis splitting one contract by tag, and carrying them as three
    surfaces tripled Imperial's apparent footprint for a single vendor-operated API.
  humanURL: https://spiral.imperial.ac.uk/
  baseURL: https://spiral.imperial.ac.uk/server/api
